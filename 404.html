    <script>
      // 한 번 열면 앱 내용을 휴대폰에 저장해 두고, 다음부터는 인터넷 없이도 열리게 한다.

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- 미리 그린 첫 화면: 앱이 준비되면 App.tsx가 지운다 -->
    <div id="boot" aria-hidden="true">
      <div class="wrap">
        <h1 class="title serif">단어 3000</h1>
        <p class="sub">가장 자주 쓰이는 영어 단어 3,000개.<br />카드를 눌러 뜻을 확인하고, 외운 단어는 넘겨두세요.</p>
        <div class="bands">
          <div class="band"><span class="k serif" style="color: var(--b1)">1k</span><div class="grow"><div class="name">기초 1,000단어</div><div class="meta" data-meta="1">0개 외움 · 0%</div><div class="bar"><i data-bar="1" style="background: var(--b1)"></i></div></div><span class="go">시작</span></div>
          <div class="band"><span class="k serif" style="color: var(--b2)">2k</span><div class="grow"><div class="name">초급 1,000단어</div><div class="meta" data-meta="2">0개 외움 · 0%</div><div class="bar"><i data-bar="2" style="background: var(--b2)"></i></div></div><span class="go">시작</span></div>
          <div class="band"><span class="k serif" style="color: var(--b3)">3k</span><div class="grow"><div class="name">초중급 1,000단어</div><div class="meta" data-meta="3">0개 외움 · 0%</div><div class="bar"><i data-bar="3" style="background: var(--b3)"></i></div></div><span class="go">시작</span></div>
        </div>
        <div class="opts">
          <div class="opt">보여줄 단어<div class="seg" data-opt="scope"><span data-v="left">안 외운 것</span><span data-v="all">전체</span></div></div>
          <div class="opt">순서<div class="seg" data-opt="order"><span data-v="shuffle">섞기</span><span data-v="abc">알파벳순</span></div></div>
          <div class="opt">먼저 보여줄 면<div class="seg" data-opt="front"><span data-v="en">영어</span><span data-v="ko">한글 뜻</span></div></div>
        </div>
        <div class="links"><div class="ghost">단어 찾기</div><div class="ghost">외운 단어 복습</div></div>
        <p class="note">진도는 이 휴대폰에만 저장됩니다. 앱을 지우거나 다른 기기에서는 처음부터 시작해요.<br />출처: Paul Nation BNC/COCA 1k~3k 목록.</p>
      </div>
    </div>
    <script>
      // 저장된 진도와 옵션을 읽어 미리 그린 화면에도 바로 반영한다 (단어 id: 1k=1~1000, 2k=1001~2000, 3k=2001~3000)
      (function () {
        var st = {};
        try { st = JSON.parse(localStorage.getItem('w3000.v1') || '{}') || {}; } catch (e) {}
        var counts = { 1: 0, 2: 0, 3: 0 };
        (st.done || []).forEach(function (id) { var b = Math.ceil(id / 1000); if (counts[b] !== undefined) counts[b]++; });
        [1, 2, 3].forEach(function (b) {
          var p = Math.round((counts[b] / 1000) * 100);
          document.querySelector('[data-meta="' + b + '"]').textContent = counts[b].toLocaleString() + '개 외움 · ' + p + '%';
          document.querySelector('[data-bar="' + b + '"]').style.width = p + '%';
        });
        var opts = { scope: st.scope === 'all' ? 'all' : 'left', order: st.order === 'abc' ? 'abc' : 'shuffle', front: st.front === 'ko' ? 'ko' : 'en' };
        Object.keys(opts).forEach(function (k) {
          var on = document.querySelector('[data-opt="' + k + '"] [data-v="' + opts[k] + '"]');
          if (on) on.className = 'on';
        });
      })();
    </script>
