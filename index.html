    <script>
      // 한 번 열면 앱 내용을 휴대폰에 저장해 두고, 다음부터는 인터넷 없이도 열리게 한다.

      if ('serviceWorker' in navigator && location.pathname.startsWith('/word3000')) {
        window.addEventListener('load', function () {

    </script>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- 미리 그린 첫 화면: 앱이 준비되면 App.tsx가 지운다 -->
    <div id="boot" aria-hidden="true">
      <div class="wrap">
        <h1 class="title serif">단어 3000</h1>
        <p class="sub">가장 자주 쓰이는 영어 단어 3,000개</p>
        <div class="bands">
          <div class="band"><span class="k serif" style="color: var(--b1)">1k</span><div class="grow"><div class="top"><span class="name">기초</span><span class="prog" data-prog="1">0 / 1,000</span></div><div class="bar"><i data-bar="1" style="background: var(--b1)"></i></div></div></div>
          <div class="band"><span class="k serif" style="color: var(--b2)">2k</span><div class="grow"><div class="top"><span class="name">초급</span><span class="prog" data-prog="2">0 / 1,000</span></div><div class="bar"><i data-bar="2" style="background: var(--b2)"></i></div></div></div>
          <div class="band"><span class="k serif" style="color: var(--b3)">3k</span><div class="grow"><div class="top"><span class="name">초중급</span><span class="prog" data-prog="3">0 / 1,000</span></div><div class="bar"><i data-bar="3" style="background: var(--b3)"></i></div></div></div>
        </div>
        <p class="section">학습 설정</p>
        <div class="group">
          <div class="row"><span class="label">보여줄 단어</span><div class="seg" data-opt="scope"><span data-v="left">안 외운 것</span><span data-v="all">전체</span></div></div>
          <div class="sep"></div>
          <div class="row"><span class="label">순서</span><div class="seg" data-opt="order"><span data-v="shuffle">섞기</span><span data-v="abc">알파벳순</span></div></div>
          <div class="sep"></div>
          <div class="row"><span class="label">먼저 보여줄 면</span><div class="seg" data-opt="front"><span data-v="en">영어</span><span data-v="ko">한글 뜻</span></div></div>
          <div class="sep" data-push></div>
          <div class="row" data-push><span class="label">단어 알림<span class="hint">9시~22시 매 정각</span></span><div class="seg" data-opt="notify"><span data-v="off">끔</span><span data-v="on">켬</span></div></div>
        </div>
        <p class="section">복습</p>
        <div class="group">
          <div class="row"><span class="label">외운 단어 복습</span><span class="count" data-count="done">0개</span><span class="chev">›</span></div>
          <div class="sep"></div>
          <div class="row"><span class="label">어려운 단어 복습<span class="hint">5번 이상 헤맨 단어</span></span><span class="count" data-count="hard">0개</span><span class="chev">›</span></div>
          <div class="sep"></div>
          <div class="row"><span class="label">단어 찾기</span><span class="chev">›</span></div>
        </div>
        <p class="note">진도는 이 휴대폰에만 저장돼요 · 출처: Paul Nation BNC/COCA 1k~3k</p>
      </div>
    </div>
    <script>
      // 저장된 진도와 옵션을 읽어 미리 그린 화면에도 바로 반영한다 (단어 id: 1k=1~1000, 2k=1001~2000, 3k=2001~3000)
      (function () {
        var st = {};
        try { st = JSON.parse(localStorage.getItem('w3000.v1') || '{}') || {}; } catch (e) {}
        var done = st.done || [];
        var counts = { 1: 0, 2: 0, 3: 0 };
        done.forEach(function (id) { var b = Math.ceil(id / 1000); if (counts[b] !== undefined) counts[b]++; });
        [1, 2, 3].forEach(function (b) {
          var p = Math.round((counts[b] / 1000) * 100);
          document.querySelector('[data-prog="' + b + '"]').textContent = counts[b].toLocaleString() + ' / 1,000';
          document.querySelector('[data-bar="' + b + '"]').style.width = p + '%';
        });
        // 어려운 단어 기준(5번)은 src/lib/store.tsx의 HARD_MIN과 같다
        var misses = st.misses || {};
        var hard = Object.keys(misses).filter(function (k) { return misses[k] >= 5; }).length;
        document.querySelector('[data-count="done"]').textContent = done.length.toLocaleString() + '개';
        document.querySelector('[data-count="hard"]').textContent = hard.toLocaleString() + '개';
        // 단어 알림 줄은 알림을 받을 수 있는 곳(홈 화면 웹앱 등)에서만 보인다 (src/lib/push.ts의 pushSupported와 같은 조건)
        var canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.pathname.indexOf('/word3000') === 0;
        if (!canPush) document.querySelectorAll('[data-push]').forEach(function (el) { el.remove(); });
        var notify = 'off';
        try { notify = localStorage.getItem('w3000.notify') === 'on' ? 'on' : 'off'; } catch (e) {}
        var opts = { scope: st.scope === 'all' ? 'all' : 'left', order: st.order === 'abc' ? 'abc' : 'shuffle', front: st.front === 'ko' ? 'ko' : 'en', notify: notify };
        Object.keys(opts).forEach(function (k) {
          var on = document.querySelector('[data-opt="' + k + '"] [data-v="' + opts[k] + '"]');
          if (on) on.className = 'on';
        });
      })();
    </script>
